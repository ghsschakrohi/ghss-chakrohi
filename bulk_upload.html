<!DOCTYPE html>
<html>
<head><title>Bulk Upload - GHSS Chakrohi</title></head>
<body style="font-family:Arial; max-width:600px; margin:50px auto; padding:20px; border:1px solid #ddd; border-radius:10px;">
    <h2 style="color:#0b3d91; text-align:center;">📤 Bulk Upload Students</h2>
    <p style="text-align:center;">Upload Excel file (.xlsx)</p>
    <form action="/bulk-upload-students" method="POST" enctype="multipart/form-data">
        <input type="file" name="excel_file" accept=".xlsx,.xls" required 
        style="width:100%; padding:15px; border:2px dashed #0b3d91; border-radius:8px; margin:20px 0;">
        <button type="submit" style="width:100%; padding:14px; background:#0b3d91; color:white; border:none; border-radius:6px; font-size:16px;">
            🚀 Upload & Load Data
        </button>
    </form>
    <p style="text-align:center; margin-top:20px;"><a href="/admissions_list.html">← Back to Admissions List</a></p>
</body>
</html>
