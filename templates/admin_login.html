<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - GHSS Chakrohi</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body{font-family:'Segoe UI',Arial;background:#eef2f7;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
        .box{background:white;padding:30px;border-radius:12px;box-shadow:0 5px 20px #0001;width:100%;max-width:360px;border-top:4px solid #0b3d91}
        h2{color:#0b3d91;margin:0 0 5px 0}
        p{color:#666;font-size:13px;margin:0 0 15px 0}
        input{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ccc;box-sizing:border-box}
        button{width:100%;padding:12px;background:#0b3d91;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:8px}
        a{color:#0b3d91;text-decoration:none}
        a:hover{text-decoration:underline}
    </style>
</head>
<body>
    <div class="box">
        <h2>🏫 GHSS Chakrohi</h2>
        <p>Admin / Teacher Login</p>
        <form method="POST">
            <input type="text" name="username" placeholder="Username (e.g. paramjit.sir)" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        
        <div style="text-align:center; margin-top:15px;">
            <a href="/forgot-password" style="font-size:13px; font-weight:600;">🔑 Forgot Password? Get OTP on Mobile</a>
        </div>
        
        <div style="text-align:center; margin-top:10px;">
            <a href="/" style="font-size:12px; color:#666;">← Back to Home</a>
        </div>
    </div>
</body>
</html>
