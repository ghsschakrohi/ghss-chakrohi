<!DOCTYPE html>
<html>
<head>
<title>Check Result - GHSS Chakrohi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial; background:#f0f4ff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0}
.box{background:white; padding:30px; border-radius:12px; box-shadow:0 4px 20px #0001; width:350px; text-align:center}
input{width:90%; padding:12px; margin:15px 0; border:1px solid #ccc; border-radius:6px; font-size:16px}
button{width:95%; padding:12px; background:#0b3d91; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer}
button:hover{background:#082a63}
</style>
</head>
<body>
<div class="box">
<h2 style="color:#0b3d91;">GHSS Chakrohi</h2>
<p>Check Monthly Result</p>
<form action="/api/check_result" method="POST">
<input name="reg_no" placeholder="Enter Reg No e.g. G2021" required>
<button type="submit">Check Result</button>
</form>
<br>
<a href="/">← Back to Home</a>
</div>
</body>
</html>
