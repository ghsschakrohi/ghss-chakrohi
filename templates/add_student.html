<!DOCTYPE html>
<html><head><title>Add Student - GHSS Chakrohi</title>
<style>
body{font-family:Arial;background:#f5f7fb;padding:20px}
.card{background:white;padding:25px;border-radius:12px;max-width:700px;margin:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
input,select{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{padding:12px 20px;background:#0d47a1;color:white;border:0;border-radius:8px;cursor:pointer}
a{color:#0d47a1;text-decoration:none}
</style></head>
<body>
<div class="card">
<h2 style="color:#0d47a1">➕ Add New Student</h2>
<p><a href="/dashboard">← Back to Dashboard</a></p>
{% if msg %}<p style="color:green;background:#e6ffe6;padding:8px;border-radius:6px">{{msg}}</p>{% endif %}
{% if error %}<p style="color:red;background:#ffe6e6;padding:8px;border-radius:6px">{{error}}</p>{% endif %}
<form method="post">
<label>Admission No</label><input name="admission_no" required>
<label>Student Name</label><input name="name" required>
<label>Father Name</label><input name="father_name">
<label>Class</label><select name="class_name"><option>6th</option><option>7th</option><option>8th</option><option>9th</option><option>10th</option><option>11th</option><option>12th</option></select>
<label>Roll No</label><input name="roll_no">
<label>DOB</label><input type="date" name="dob">
<button type="submit">Save Student</button>
</form>
</div>
</body></html>
