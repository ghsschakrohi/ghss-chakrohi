<!DOCTYPE html>
<html>
<head>
<title>Forgot Password - GHSS Chakrohi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#eef2f7;margin:0;padding:0;display:flex;justify-content:center;align-items:center;height:100vh}
.box{background:white;padding:30px;border-radius:12px;box-shadow:0 5px 25px #0002;width:100%;max-width:380px;text-align:center;border-top:4px solid #0b3d91}
h2{color:#0b3d91;margin:0 0 10px 0}
p{color:#555;font-size:13px;margin-bottom:20px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;background:#0b3d91;color:white;border:none;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px;font-size:15px}
button:hover{background:#082f70}
a{color:#0b3d91;text-decoration:none;font-size:13px;display:inline-block;margin-top:15px}
.logo{font-size:40px;margin-bottom:10px}
</style>
</head>
<body>
<div class="box">
<div class="logo">🏫</div>
<h2>Forgot Password?</h2>
<p>GHSS Chakrohi - Enter your username to receive OTP on registered mobile</p>
<form method="POST" action="/forgot-password">
<input type="text" name="username" placeholder="Enter Username (e.g. paramjit.sir)" required>
<button type="submit">Send OTP via SMS</button>
</form>
<a href="/admin">← Back to Login</a>
<p style="margin-top:20px;font-size:11px;color:#888">After your ₹100 recharge #576715049, real SMS will come on mobile</p>
</div>
</body>
</html>
